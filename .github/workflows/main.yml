name: Build TubTraec Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "tubtrace-desktop-windows.zip" `
            -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tubtrace-desktop-windows
          path: tubtrace-desktop-windows.zip
          retention-days: 30
